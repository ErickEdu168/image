<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Farm Code - Avançado</title>
<style>
body { font-family: Arial; text-align:center; background:#eef7e1; }
#grid { display:grid; grid-template-columns:repeat(6,60px); gap:2px; justify-content:center; margin:20px; }
.cell { width:60px; height:60px; background:#c5e1a5; display:flex; align-items:center; justify-content:center; }
button { margin:5px; padding:8px; }
</style>
</head>
<body>

<h1>🌾 Farm Code</h1>
<h3>Nível <span id="level">1</span></h3>
<p>Pontuação: <span id="score">0</span></p>

<div id="grid"></div>

<div>
<button onclick="add('F')">Frente</button>
<button onclick="add('L')">Esquerda</button>
<button onclick="add('R')">Direita</button>
<button onclick="add('LOOP')">Loop x2</button>
<button onclick="run()">Executar</button>
<button onclick="reset()">Reset</button>
</div>

<p id="commands"></p>
<p id="msg"></p>

<script>
const size = 6;
let level = 1;
let score = 0;
let commands = [];

let maps = [
 {goal:[5,5], obstacles:[[2,2],[3,2]]},
 {goal:[4,4], obstacles:[[1,1],[2,1],[3,1]]}
];

let player;

function start(){
 player = {x:0,y:0,dir:"right"};
 commands=[];
 document.getElementById("commands").textContent="";
 draw();
}

function draw(){
 const grid = document.getElementById("grid");
 grid.innerHTML="";
 for(let y=0;y<size;y++){
   for(let x=0;x<size;x++){
     let cell=document.createElement("div");
     cell.className="cell";
     if(x==player.x && y==player.y) cell.textContent="👨‍🌾";
     else if(x==maps[level-1].goal[0] && y==maps[level-1].goal[1]) cell.textContent="🌱";
     else if(maps[level-1].obstacles.some(o=>o[0]==x && o[1]==y)) cell.textContent="🪨";
     grid.appendChild(cell);
   }
 }
}

function add(cmd){
 commands.push(cmd);
 document.getElementById("commands").textContent="Código: "+commands.join(" ");
}

function move(){
 if(player.dir=="right") player.x++;
 if(player.dir=="left") player.x--;
 if(player.dir=="up") player.y--;
 if(player.dir=="down") player.y++;
}

function turnLeft(){
 player.dir = {up:"left",left:"down",down:"right",right:"up"}[player.dir];
}

function turnRight(){
 player.dir = {up:"right",right:"down",down:"left",left:"up"}[player.dir];
}

function run(){
 for(let i=0;i<commands.length;i++){
   let cmd = commands[i];
   if(cmd=="F") move();
   if(cmd=="L") turnLeft();
   if(cmd=="R") turnRight();
   if(cmd=="LOOP" && commands[i+1]){
       for(let j=0;j<2;j++){
           if(commands[i+1]=="F") move();
       }
   }
 }

 if(player.x==maps[level-1].goal[0] && player.y==maps[level-1].goal[1]){
   score+=10;
   document.getElementById("msg").textContent="🎉 Nível concluído!";
   if(level < maps.length){ level++; document.getElementById("level").textContent=level; start(); }
 }
 else document.getElementById("msg").textContent="❌ Tente novamente";

 document.getElementById("score").textContent=score;
 draw();
}

function reset(){ start(); }

start();
</script>
</body>
</html>
